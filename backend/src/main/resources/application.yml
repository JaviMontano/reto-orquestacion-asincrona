spring:
  application:
    name: orchestration-race
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orchestration}
    username: ${DB_USER:orchestration}
    password: ${DB_PASSWORD:orchestration}
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
app:
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://host.docker.internal:3000}
